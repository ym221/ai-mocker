services:
  mockforge:
    build: .
    ports:
      # HOST_PORT 控制宿主机端口；容器内固定 3000。
      # 默认 9020（阿里云此服务器开放 9000-9099）。本地开发不设置时同样用 9020；
      # 想沿用 3000 → 在 .env 加 HOST_PORT=3000。
      - "${HOST_PORT:-9020}:3000"
    volumes:
      - mockforge-data:/app/data
      - mockforge-uploads:/app/uploads
      - mockforge-generated:/app/generated
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=./data/mockforge.db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - JWT_EXPIRES_IN=7d
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ALLOW_REGISTRATION=true
    restart: unless-stopped

volumes:
  mockforge-data:
  mockforge-uploads:
  mockforge-generated:
