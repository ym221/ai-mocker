services:
  mockforge:
    build: .
    ports:
      # HOST_PORT 控制宿主机端口；容器内固定 3000。
      # 默认 9020（阿里云此服务器开放 9000-9099）。本地开发不设置时同样用 9020；
      # 想沿用 3000 → 在 .env 加 HOST_PORT=3000。
      - "${HOST_PORT:-9020}:3000"
    volumes:
      - mockforge-data:/app/data
      - mockforge-uploads:/app/uploads
      - mockforge-generated:/app/generated
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=./data/mockforge.db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - JWT_EXPIRES_IN=7d
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ALLOW_REGISTRATION=true
      # AI 默认 Provider(.env 兜底配置;首次启动时自动创建一条 scope=public 的 provider)
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-}
      - DEFAULT_AI_BASE_URL=${DEFAULT_AI_BASE_URL:-}
      - DEFAULT_AI_API_KEY=${DEFAULT_AI_API_KEY:-}
      # MCP API Key HMAC 密钥(MCP 鉴权用)
      - MCP_API_KEY_SECRET=${MCP_API_KEY_SECRET:-}
      # 单次 chat 生成的硬超时(毫秒);默认 20 分钟。reasoning model 如 v4-pro/o1 建议 1800000(30 分钟)
      - CHAT_RUN_TIMEOUT_MS=${CHAT_RUN_TIMEOUT_MS:-}
      # 出境代理(可选;不设则不走代理)
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    restart: unless-stopped
    # ----------------------------------------------------------------
    # 资源限制(可选):AI 长任务 + 多模块生成累计可能吃到 800MB+。
    # 服务器内存吃紧时若没设限,容器被宿主机 OOM killer 杀掉 → 自动重启 →
    # 前端所有正在跑的对话显示"服务已重启,生成被中断"。
    # 若频繁看到这个提示,在 .env 加 MOCKFORGE_MEM_LIMIT=2g 并取消下面注释。
    # ----------------------------------------------------------------
    # deploy:
    #   resources:
    #     limits:
    #       memory: ${MOCKFORGE_MEM_LIMIT:-2g}

volumes:
  mockforge-data:
  mockforge-uploads:
  mockforge-generated:
